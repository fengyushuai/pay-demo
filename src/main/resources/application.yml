server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pay_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always          # 启动时执行 schema.sql（内部全部 IF NOT EXISTS，可重复启动）
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql

logging:
  level:
    com.demo.pay: debug
